<div class="eqLogic eqLogic-widget alexa-widget #custom_layout# #eqLogic_class#" data-eqType="#eqType#" data-eqLogic_id="#id#" data-version="#version#" data-translate-category="#translate_category#" data-category="#category#" data-tags="#tags#" style="width: 100%;#style#">
    <center class="widget-name">
        <span class="reportModeVisible">#name_display#</span>
        <a href="#eqLogic_href#" class="reportModeHidden">#name_display#</a>
    </center>

    <div class="alexa-card-content">
        <!-- MONITOR DE CALIDAD DEL AIRE (DEDICADO) -->
        #aqm_display#

        <!-- CONTROLES ESTÁNDAR ECHO (CONDICIONALES) -->
        #header_row#
        #sensors_display#
        #media_section#
        #volume_section#
        #last_command_section#
    </div>

    <script>
        (function() {
            var $widget = $('.alexa-widget[data-eqLogic_id=#id#]');
            $widget.find('.cmd-btn-alexa').off('click').on('click', function() {
                var cmdId = $(this).attr('data-cmd_id');
                if (cmdId) {
                    jeedom.cmd.execute({id: cmdId});
                }
            });
            $widget.find('.alexa-vol-slider').off('change').on('change', function() {
                var cmdId = $(this).attr('data-cmd_id');
                var val = $(this).val();
                $(this).siblings('.alexa-vol-val').text(val + '%');
                if (cmdId) {
                    jeedom.cmd.execute({id: cmdId, value: {slider: val}});
                }
            });
        })();
    </script>
</div>
